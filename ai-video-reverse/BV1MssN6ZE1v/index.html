<script id="deck-data" type="application/json">{"title":"严查税、补社保只是序章：土地财政退潮后，钱从哪里来？","author":"Alpha茶水间","source":"https://www.bilibili.com/video/BV1MssN6ZE1v","duration":623.92,"slides":[{"id":1,"start":0,"end":13.8,"title":"财政的钱，为什么还是不够？","phaseName":"财政缺钱的信号","scene":"fiscal","phase":1,"source":"","timeLabel":"00:00—00:13","cues":[{"start":0.0,"end":8.3,"text":"离岸信托开始明确征税了，很多人把它当成一条富人税务新闻。但我看到这条新闻的时候，真正感兴趣的是另一件事，"},{"start":8.62,"end":14.3,"text":"连过去最难征的钱都开始追了，财政到底有多缺钱。高盛最近算了一笔账，"}]},{"id":2,"start":13.8,"end":34.1,"title":"多收的钱，填不满缺口","phaseName":"严查税与强化社保：新增5000亿元","scene":"gap","phase":1,"source":"2026年，相比2021年 · 高盛测算","timeLabel":"00:13—00:34","cues":[{"start":14.78,"end":24.42,"text":"2026年相比2021年，更严格的税收征管，加上更严格的社保征缴，大约给政府多带来了5000亿元收入。听起来很多，"},{"start":24.58,"end":33.8,"text":"但同一时期因为土地财政缩水，政府债务利息增加，再加上社保基金需要更多财政补贴，新增的资金缺口是多少？"}]},{"id":3,"start":34.1,"end":44.4,"title":"多收的钱，填不满缺口","phaseName":"2.8万亿元缺口，仍差2.3万亿元","scene":"gap","phase":2,"source":"2026年，相比2021年 · 高盛测算","timeLabel":"00:34—00:44","cues":[{"start":34.24,"end":43.98,"text":"2.8万亿元，也就是说现在大家已经明显感受到的，严查税补社保填掉的缺口连五分之一都不到，最后还剩2.3万亿。"}]},{"id":4,"start":44.4,"end":64.1333,"title":"多收的钱，填不满缺口","phaseName":"2030年：缺口或至4.1万亿元","scene":"gap","phase":3,"source":"2026年，相比2021年 · 高盛测算","timeLabel":"00:44—01:04","cues":[{"start":44.28,"end":53.5,"text":"而按照高盛的测算，到2030年，这个缺口还可能进一步扩大到4.1万亿元。所以，离岸信托征税真正值得看的，"},{"start":53.66,"end":63.64,"text":"不是有钱人又多交了一笔税，而是，财政已经开始往过去最难触达的地方找钱了。可更麻烦的是，已经找到这个份上了，钱还是不够。"}]},{"id":5,"start":64.1333,"end":97.3667,"title":"看起来，中国还有加税空间？","phaseName":"中口径税负：中国24.4%，OECD 34.1%","scene":"gross","phase":1,"source":"2024年 · CF40研究","timeLabel":"01:04—01:37","cues":[{"start":64.18,"end":72.66,"text":"那下一步怎么办？要回答这个问题，先得看清楚一件事。很多人一直觉得，中国不是一个传统意义上的高税国家。"},{"start":73.1,"end":74.84,"text":"这个印象其实有数据支持。"},{"start":74.84,"end":88.86,"text":"CF40的一项研究测算，2024年按照与OECD较为接近的中口径宏观税负衡量，中国大约是24.4%，OECD平均是34.1%，中国明显更低。"},{"start":89.26,"end":91.74000000000001,"text":"看起来中国似乎还有很大的加税空间。"},{"start":91.74,"end":100.86,"text":"但事情没这么简单，因为OECD，很多国家收上去的钱，又通过养老金、医疗、失业保障、家庭福利重新返还给居民。"}]},{"id":6,"start":97.3667,"end":111.5,"title":"减去返还居民的部分，留下多少？","phaseName":"收走的钱 − 公共社会保障支出","scene":"return","phase":1,"source":"2024年 · CF40研究","timeLabel":"01:37—01:51","cues":[{"start":101.3,"end":109.75999999999999,"text":"所以CF40又算了一个指标，把政府收走的钱减掉公共社会保障支出，他们把它叫做实收口径宏观税负。"},{"start":110.32,"end":111.5,"text":"结果一下就反过来了。"}]},{"id":7,"start":111.5,"end":127.4667,"title":"减去返还居民的部分，留下多少？","phaseName":"实收税负：中国13.9%，OECD 12.9%","scene":"net","phase":1,"source":"2024年 · CF40研究","timeLabel":"01:51—02:07","cues":[{"start":111.5,"end":119.56,"text":"2024年中国大约是13.9%，OECD平均是12.9%，中国反而略高。"},{"start":120.16,"end":128.36,"text":"38个OECD国家里有23个低于中国。但真正扎眼的还不是这一个百分点，而是把收入放到旁边一起看。"}]},{"id":8,"start":127.4667,"end":145.7333,"title":"收入、福利与净负担","phaseName":"人均收入四成多，净负担已追上","scene":"income","phase":1,"source":"人均GDP按购买力平价比较","timeLabel":"02:07—02:25","cues":[{"start":128.84,"end":134.28,"text":"中国的人均GDP按购买力平价计算，大约只有OECD平均水平的四成多。"},{"start":134.54,"end":140.0,"text":"这意味着什么？收入没追上，公共福利没追上，实收税负反而先追上了。"},{"start":140.0,"end":145.26,"text":"换句话说，我们还没有发达国家的收入，却已经先摸到了发达国家的净负担。"}]},{"id":9,"start":145.7333,"end":184.0333,"title":"拿走以后，创造了多少？","phaseName":"基础设施投资与长期回报","scene":"infra","phase":1,"source":"","timeLabel":"02:25—03:04","cues":[{"start":145.84,"end":151.04,"text":"当然，说到这里一定会有一个反驳，政府集中更多资源就一定是不合理的吗？"},{"start":151.58,"end":156.12,"text":"当然不是。中国过去几十年的高速发展，本身就是最好的反例。"},{"start":156.52,"end":161.76,"text":"当一个国家缺高速、缺铁路、缺港口、缺电网、缺城市基础设施的时候，"},{"start":161.88,"end":171.12,"text":"把更多资源集中起来投资，完全可能创造巨大的长期回报。那个时候，多拿走一块钱，可能是在创造未来的十块钱。"},{"start":171.68,"end":177.94,"text":"这也是为什么单纯比较中国政府拿走多少，欧美政府拿走多少，意义没有想象中那么大。"},{"start":178.46,"end":183.56,"text":"真正重要的问题从来不是拿了多少，而是拿走以后创造了多少。"}]},{"id":10,"start":184.0333,"end":230.5,"title":"同样的投入，回报正在改变","phaseName":"资本存量增加，投资边际回报下降","scene":"returns","phase":1,"source":"","timeLabel":"03:04—03:50","cues":[{"start":183.56,"end":193.48,"text":"而今天最麻烦的变化，恰恰发生在这里，中国已经不再处于那个到处缺基础设施，只要增加资本投入就能轻易获得高回报的阶段。"},{"start":193.78,"end":200.76,"text":"资本存量越来越大，投资的边际回报持续下降，一些领域甚至已经开始面对产能过剩和资源错配。"},{"start":200.76,"end":207.88,"text":"IMF对中国经济的最新评估也把投资回报下降，列为中期增长继续放缓的重要原因，"},{"start":208.32,"end":217.45999999999998,"text":"并建议财政支出更多从低效率投资转向消费和居民部门。同样拿走一块钱，今天已经越来越难换回过去那么多增长。"},{"start":218.04,"end":228.01999999999998,"text":"如果故事到这里结束，其实答案反而很简单。投资回报下降了，那政府少拿一点，把更多收入留给居民消费，留给私人部门投资，"},{"start":228.45999999999998,"end":230.12,"text":"经济自然完成再平衡。"}]},{"id":11,"start":230.5,"end":235.76,"title":"想少拿，为什么不容易？","phaseName":"更多收入留给居民与私人部门","scene":"rebalance","phase":1,"source":"","timeLabel":"03:50—03:55","cues":[{"start":230.12,"end":235.76,"text":"可真正困难的地方恰恰在这里，现在想少拿已经没有过去那么容易了。"}]},{"id":12,"start":235.76,"end":271.5667,"title":"想少拿，为什么不容易？","phaseName":"债务、养老金和老龄化锁住支出","scene":"locked","phase":1,"source":"","timeLabel":"03:55—04:31","cues":[{"start":236.14000000000001,"end":241.64000000000001,"text":"因为过去几十年的高投资留下来的不只有高铁、公路、城市和产业能力，"},{"start":242.14000000000001,"end":250.08,"text":"债也留了下来，利息要付，养老金要补，老龄化还在继续。所以这里出现了一个非常残酷的变化，"},{"start":250.48000000000002,"end":259.9,"text":"过去拿走更多的钱是为了建设未来，今天越来越多的钱却要用来偿还过去，维持现在。这才是财政问题真正难解的地方。"},{"start":260.12,"end":268.52,"text":"投资回报下降以后，收入端本来应该慢慢减轻负担。可过去留下来的债务和今天越来越刚性的养老支出，"},{"start":268.86,"end":271.22,"text":"却把相当一部分财政需求锁住了。"}]},{"id":13,"start":271.5667,"end":290.08,"title":"土地财政：钱从哪里来？","phaseName":"房地产、银行与地方财政","scene":"land","phase":1,"source":"","timeLabel":"04:31—04:50","cues":[{"start":271.64,"end":281.64,"text":"而偏偏就在这个时候，过去最重要的一台财政机器也开始失效。土地，过去房地产上涨，开发商拿地，银行放贷，居民买房，"},{"start":281.94,"end":290.08,"text":"地方政府并不需要把所有财政压力都直接变成税。很多钱可以从土地里拿。所以过去中国财政最特别的地方，"}]},{"id":14,"start":290.08,"end":312.2667,"title":"土地财政：钱从哪里来？","phaseName":"家庭储蓄与现金流进入土地体系","scene":"land","phase":2,"source":"","timeLabel":"04:50—05:12","cues":[{"start":290.40000000000003,"end":297.28000000000003,"text":"不是没有负担，而是很多负担，不长得像税。你不会在工资条上看到一项叫土地财政的扣款，"},{"start":297.62,"end":304.86,"text":"但一套房子吃掉一个家庭几十年的储蓄和现金流，其中一部分最终还是进入了土地和财政体系。"},{"start":304.86,"end":311.84000000000003,"text":"土地财政最大的魔术就是政府获得了巨额收入，但居民未必产生同等强烈的交税感。"}]},{"id":15,"start":312.2667,"end":323.72,"title":"收入退潮，账单还在","phaseName":"土地出让收入较高点下降约70%","scene":"expense","phase":1,"source":"高盛报告及测算","timeLabel":"05:12—05:23","cues":[{"start":312.34000000000003,"end":322.0,"text":"可现在，这场魔术越来越难演下去了。高盛报告显示，土地出让收入相比2021年高点已经下降大约70%，可退潮的只有收入，"},{"start":322.28000000000003,"end":323.32,"text":"账单没有一起退。"}]},{"id":16,"start":323.72,"end":333.48,"title":"收入退潮，账单还在","phaseName":"199万亿元债务，6.2万亿元利息","scene":"expense","phase":2,"source":"高盛报告及测算","timeLabel":"05:23—05:33","cues":[{"start":323.72,"end":333.48,"text":"高盛估算，2025年中国广义政府债务已经达到199万亿元，2026年相关利息支出大约6.2万亿元。与此同时，"}]},{"id":17,"start":333.48,"end":359.2333,"title":"收入退潮，账单还在","phaseName":"财政对社保基金补贴超3万亿元","scene":"expense","phase":3,"source":"高盛报告及测算","timeLabel":"05:33—05:59","cues":[{"start":333.48,"end":342.96000000000004,"text":"财政对社保基金的补贴从2005年的约600亿元增加到了2026年的3万亿元以上。于是现在的局面其实很简单，"},{"start":343.5,"end":353.0,"text":"土地财政在缩水，债务利息还要付，养老和医疗越来越贵，收入来源在退潮，支出责任却没有跟着退潮。那怎么办？"},{"start":353.58000000000004,"end":359.42,"text":"财政缺钱的时候，第一反应通常不是马上发明一个新税，而是先把旧账收干净。"}]},{"id":18,"start":359.2333,"end":374.1,"title":"先把旧账收干净","phaseName":"没交的开始交，少交的开始补","scene":"collect","phase":1,"source":"","timeLabel":"05:59—06:14","cues":[{"start":359.72,"end":367.14,"text":"以前该交没交的开始交，以前少交的开始补，以前社保按照较低工资基数交的逐渐往实际工资靠，"},{"start":367.5,"end":373.68,"text":"所以你才会看到严查税补社保，甚至现在连离岸信托都开始重新进入征税视野。"}]},{"id":19,"start":374.1,"end":394.8,"title":"征管收紧：同一套规则，不同的执行","phaseName":"灵活 → 灰色空间 → 漏洞","scene":"rules","phase":1,"source":"","timeLabel":"06:14—06:34","cues":[{"start":374.18,"end":383.0,"text":"因为财政缺钱的时候，最先被看见的往往不是哪里还能创造一笔新收入，而是那些过去还能被放过的钱，以前叫灵活，"},{"start":383.29999999999995,"end":393.21999999999997,"text":"后来叫灰色空间，再后来叫漏洞，最后变成四个字，应收尽收，规则甚至不需要大改，税率也可以一分钱不涨，只是以前执行的松，"},{"start":393.46,"end":394.4,"text":"现在执行的严。"}]},{"id":20,"start":394.8,"end":403.5,"title":"征管收紧：同一套规则，不同的执行","phaseName":"应收尽收，实际负担上升","scene":"rules","phase":2,"source":"","timeLabel":"06:34—06:43","cues":[{"start":394.8,"end":404.2,"text":"但对企业和居民来说，结果很直接，名义税率可以不动，实际负担，照样可以往上走。问题是，这种办法终究有上限，"}]},{"id":21,"start":403.5,"end":436.0667,"title":"堵住漏洞，也有上限","phaseName":"新增约1万亿 / 年，缺口或至4.1万亿","scene":"limits","phase":1,"source":"2030年 · 高盛测算","timeLabel":"06:43—07:16","cues":[{"start":404.2,"end":412.71999999999997,"text":"漏洞可以堵，漏掉的钱可以追回来，但你不可能靠堵漏洞，凭空创造出一条新的财政收入来源。高盛测算，"},{"start":413.06,"end":422.65999999999997,"text":"即使到2030年，把这些征管措施继续扩大，每年能够增加的财政资金，大约也就是一万亿元。而土地收入下降，债务成本增加，"},{"start":422.96,"end":432.16,"text":"社保补贴增加形成的缺口，却可能达到4.1万亿元。也就是说，把该交的都交了，把该补的都补了，把能查的都查了，账，"},{"start":432.42,"end":436.48,"text":"还是对不上。到这里再回头看刚才那个13.9%，"}]},{"id":22,"start":436.0667,"end":469.7,"title":"负担已经不低，钱还是不够","phaseName":"实收税负13.9%，财政资金仍不足","scene":"burden","phase":1,"source":"CF40实收口径","timeLabel":"07:16—07:49","cues":[{"start":436.48,"end":445.46,"text":"事情就完全不一样了。按照CF40这个实收口径，我们的负担已经来到了OECD的中等水平，可财政的钱依然不够。"},{"start":446.34000000000003,"end":455.28,"text":"所以我们面对的根本不是，现在税很低，以后多交一点就好了，而是另一个完全不同的问题，现在已经不低了，可钱还是不够，"},{"start":455.7,"end":465.04,"text":"那以后还要从哪里拿？人均收入还没有追上发达国家，公共福利也没有追上发达国家。按照这种实收口径，负担却已经追上来了，"},{"start":465.46000000000004,"end":469.22,"text":"然后现在告诉你这还不够，这才是这笔账最沉重的地方。"}]},{"id":23,"start":469.7,"end":486.8,"title":"接下来，看税基的边界","phaseName":"让更多的钱进入征税范围","scene":"taxbase","phase":1,"source":"","timeLabel":"07:49—08:06","cues":[{"start":469.86,"end":478.22,"text":"第一阶段，把以前没收上来的钱收上来，依然解决不了问题。那接下来真正值得关注的，就不是税率，而是税基。"},{"start":478.76,"end":486.6,"text":"因为加税最直白的办法，是提高税率，但还有一种更不显眼的办法，让越来越多的钱，变成可以被征税的钱。"}]},{"id":24,"start":486.8,"end":498.22,"title":"接下来，看税基的边界","phaseName":"工资、利润、消费、资本收益与财产","scene":"taxbase","phase":2,"source":"","timeLabel":"08:06—08:18","cues":[{"start":486.8,"end":495.76,"text":"扩大纳税人群，减少税收优惠，提高社保实际缴费基数，扩大综合所得征税范围，让更多经营所得，资本所得，"},{"start":495.94,"end":497.85999999999996,"text":"财产所得进入税收体系，"}]},{"id":25,"start":498.22,"end":522.7333,"title":"接下来，看税基的边界","phaseName":"税收收入增长与未来财产税研究","scene":"taxbase","phase":3,"source":"","timeLabel":"08:18—08:42","cues":[{"start":498.21999999999997,"end":507.79999999999995,"text":"甚至未来研究房产税，遗产税。所以高盛一边说，他们并不预计中国出现大规模广泛的名义税率上调。另一边又判断，"},{"start":508.09999999999997,"end":517.62,"text":"未来几年乃至几十年，中国税收收入提高，很可能成为一个结构性趋势。这两句话一点都不矛盾，因为未来的加税"},{"start":517.62,"end":522.94,"text":"未必发生在税率表上，它更可能发生在税基的边界上。税率没有涨，"}]},{"id":26,"start":522.7333,"end":541.2,"title":"税率表没动，能征到的部分变多","phaseName":"足额缴纳、优惠减少、范围扩大","scene":"static","phase":1,"source":"","timeLabel":"08:42—09:01","cues":[{"start":523.24,"end":531.92,"text":"但以前少交的，现在足额交，以前享受的优惠慢慢减少，以前不在征税范围里的收入逐渐纳进来。表面上看，"},{"start":532.18,"end":540.68,"text":"税率表甚至可以很多年一动不动，可工资利润，资本收益，财产，能够被财政触及的部分，却一点一点变多。"}]},{"id":27,"start":541.2,"end":557.7333,"title":"税率表没动，能征到的部分变多","phaseName":"能留下的钱更少，能被征到的钱更多","scene":"static","phase":2,"source":"","timeLabel":"09:01—09:17","cues":[{"start":541.2,"end":550.7199999999999,"text":"你甚至很难找到究竟是哪一天发生了加税，因为可能根本没有那一天，没有一个突然跳高的税率，没有一个所有人同时注意到的节点，"},{"start":551.06,"end":557.36,"text":"只是很多年以后回头看，能留下的钱比以前少了，能被征到的钱比以前多了。"}]},{"id":28,"start":557.7333,"end":565.4,"title":"财政收入的来源，正在改变","phaseName":"过去：土地、房地产、平台与债务","scene":"oldsource","phase":1,"source":"","timeLabel":"09:17—09:25","cues":[{"start":557.8399999999999,"end":565.4,"text":"过去中国财政很大程度依赖土地、房地产、地方融资平台和债务扩张，而未来它越来越需要依赖一种"}]},{"id":29,"start":565.4,"end":578,"title":"财政收入的来源，正在改变","phaseName":"未来：收入、利润、消费、收益与财产","scene":"sources","phase":1,"source":"","timeLabel":"09:25—09:38","cues":[{"start":565.4,"end":573.72,"text":"更加稳定的东西，居民收入、企业利润、消费、资本收益、财产。过去财政从土地里找钱，土地不够了，"},{"start":573.84,"end":577.6600000000001,"text":"就只能越来越多地从收入、利润、消费和财产里找钱。"}]},{"id":30,"start":578,"end":595.3333,"title":"土地财政退场，压力寻找新出口","phaseName":"低显性税负模式的基础正在退出","scene":"exit","phase":1,"source":"","timeLabel":"09:38—09:55","cues":[{"start":578.14,"end":587.2800000000001,"text":"所以土地财政退出的不只是房地产的黄金时代，它退出的很可能还是过去那套低显性税负财政模式赖以维持的重要基础。"},{"start":587.74,"end":594.9200000000001,"text":"过去很多财政压力只是没有以税的名字出现，而现在，这些压力没有消失，它们只是在寻找新的出口。"}]},{"id":31,"start":595.3333,"end":613.9667,"title":"加税，会以什么名字出现？","phaseName":"征管、实缴、优惠、直接税与财产税","scene":"ways","phase":2,"source":"","timeLabel":"09:55—10:13","cues":[{"start":594.92,"end":604.54,"text":"所以，未来真正的问题可能根本不是中国会不会加税，而是加税会以什么名字出现？是更严格的征管？"},{"start":604.9399999999999,"end":614.42,"text":"更高的社保实缴？更少的税收优惠？更大的直接税占比？还是未来某一天真正落地的财产税？严查税和强化社保"}]},{"id":32,"start":613.9667,"end":623.92,"title":"加税，会以什么名字出现？","phaseName":"严查税和强化社保，更像是序章","scene":"ending","phase":2,"source":"","timeLabel":"10:13—10:23","cues":[{"start":614.42,"end":623.92,"text":"并不是这个故事的高潮，它们更像是序章。财经、逻辑、洞见尽在Alpha茶水间"}]}]}</script>
<script>const DECK=JSON.parse(document.getElementById('deck-data').textContent);const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (name,label='') => `<svg class="pictogram" viewBox="0 0 100 100" ${label?`role="img" aria-label="${esc(label)}"`:'aria-hidden="true"'}><use href="#icon-${name}"/></svg>`;
const F = (html,n=1,style='',extra='') => `<div class="fragment ${extra}" data-order="${n}" style="${style}">${html}</div>`;
const at = (html,x,y,n=1,extra='') => F(html,n,`position:absolute;left:${x}px;top:${y}px`,extra);
const plinth = '<svg class="plinth" viewBox="0 0 160 65" aria-hidden="true"><ellipse cx="80" cy="57" rx="69" ry="7"/><polygon class="top" points="0,21 75,0 160,24 84,48"/><polygon class="side" points="84,48 160,24 160,42 84,65"/><polygon class="front" points="0,21 84,48 84,65 0,39"/></svg>';
function figure(name,label,x,y,size=82,platform=false,n=1,extra='') {return F(`${platform?plinth:''}${icon(name,label)}${label?`<div class="scene-label">${esc(label)}</div>`:''}`,n,`left:${x}px;top:${y}px;--size:${size}px`, `figure ${platform?'on-platform':''} ${extra}`);}
function floatIcon(name,x,y,size,n=1){return F(icon(name),n,`left:${x}px;top:${y}px;width:${size}px;height:${size}px`,'float-icon');}
function coinGroup(x,y,count=3,n=2){let s='';for(let i=0;i<count;i++)s+=`<span class="money-coin" style="left:${(i%3)*29}px;top:${Math.floor(i/3)*29}px">${icon('coin')}</span>`;return at(s,x,y,n);}
let flowSerial=0;
function flow(paths,n=1,animate=true){let s='';for(const d of paths){const id=`line-${++flowSerial}`;s+=`<path id="${id}" d="${d}" class="flow-path draw"/>`;if(animate)s+=`<circle r="3" class="moving-coin"><animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#${id}"/></animateMotion></circle><circle r="2.3" class="moving-coin"><animateMotion dur="4.8s" begin="-2.5s" repeatCount="indefinite"><mpath href="#${id}"/></animateMotion></circle>`;}return F(`<svg class="flow-layer" viewBox="0 0 906 360" aria-hidden="true">${s}</svg>`,n,'position:absolute;inset:0');}
const text = (t,x,y,n=1,cls='note',style='') => at(`<div class="${cls}" style="${style}">${t}</div>`,x,y,n);
const count = (n,unit='',digits=0) => `<span data-count="${n}" data-digits="${digits}">${n.toFixed(digits)}</span>${unit}`;
function receipt(name,label,value,x,y,n=1){return F(`${icon(name)}<div class="scene-label">${label}</div>${value?`<div class="receipt-value">${value}</div>`:''}`,n,`left:${x}px;top:${y}px`,'receipt');}
function header(s,i){return `<div class="slide-brand"><span>ALPHA 茶水间</span><span class="folio">${String(i+1).padStart(2,'0')} / ${DECK.slides.length}</span></div><h2 class="slide-title">${esc(s.title)}</h2>${s.source?`<div class="slide-source">${esc(s.source)}</div>`:''}`;}
function graphGrid(){return `<div class="chart-grid">${[40,30,20,10].map((n,i)=>`<div class="grid-line" style="top:${i*58.75}px"><span>${n}%</span></div>`).join('')}</div>`;}
function bars(a=24.4,b=34.1,net=false){return graphGrid()+F(`<div class="bar-comparison"><div class="chart-column"><div class="bar-number strong">${count(a,'%',1)}</div><div class="bar growbar" style="--height:${a*5.875}px"></div><div class="bar-label">中国</div></div><div class="chart-column oecd"><div class="bar-number">${count(b,'%',1)}</div><div class="bar growbar" style="--height:${b*5.875}px"></div><div class="bar-label">OECD平均</div></div></div>`,2,'position:absolute;inset:0')+(net?text('38个OECD国家中，23个低于中国',451,338,3,'small-label strong'): '');}
function taxCategory(name,label,n,dim=false){return F(`<div class="category-icon">${icon(name,label)}</div><div class="scene-label">${label}</div>`,n,'',`tax-category ${dim?'outside-category':''}`);}
const categories = [['purse','工资'],['factory','企业利润'],['cart','消费'],['chart','资本收益'],['house','财产']];
function sourceDiagram(s){let out='';if(s.scene==='exit'||s.scene==='ways'||s.scene==='ending')out+=F(`<div class="source-boundary ${s.scene!=='exit'?'strong-boundary':''}"></div>`,1,'position:absolute;inset:0');
let y=s.scene==='ways'||s.scene==='ending'?73:54;
out+=`<div class="sources-row" style="top:${y}px">${categories.map(([name,label],j)=>figure(name,j===0?'居民收入':label,0,0,69,false,j<2?1:2)).join('')}</div>`;
out+=figure('bank',s.scene==='ending'?'':'财政',405,s.scene==='ending'?188:253,82,false,2);
out+=flow([`M91 ${y+118} C20 233 145 265 437 267`,`M267 ${y+118} C236 250 373 255 437 267`,`M453 ${y+118} L453 247`,`M627 ${y+118} C678 251 530 270 469 267`,`M808 ${y+118} C862 252 586 303 469 267`],2);
if(s.scene==='ways'||s.scene==='ending'){out+=F(`<div class="policy-pills"><span>更严格的征管</span><span>更高的社保实缴</span><span>更少的税收优惠</span>${s.phase===2?'<span>更大的直接税占比</span><span>财产税</span>':''}</div>`,3,'position:absolute;inset:0');}
if(s.scene==='ending')out+=F('<div class="ending-banner">严查税、强化社保，更像是<em>序章</em>。</div>',4,'position:absolute;inset:0');return out;}
function scene(s){let out='';switch(s.scene){
 case 'fiscal':
  out+=figure('bank','离岸信托',108,91,89,true,1)+figure('bag','财政资金',547,94,82,true,2);
  out+=F('<div class="ground-rings" style="left:66px;top:198px;bottom:auto;width:196px;height:56px"></div>',1,'position:absolute;inset:0');out+=flow(['M210 205 C330 157 418 159 555 207'],2)+floatIcon('search',235,79,51,2)+coinGroup(218,205,3,3)+text('钱，够吗？',724,224,3,'note rust');break;
 case 'gap':
  out+=figure('bank','离岸信托',94,82,88,true,1)+figure('bag','财政资金',522,85,81,true,1)+flow(['M201 195 C295 151 407 163 530 200'],1)+coinGroup(197,204,3,1);
  out+=text('新增征管收入',709,21,2,'scene-label')+text(count(5000,'亿元'),690,49,2,'stat strong');
  if(s.phase>=2)out+=F(`<div class="gap-meter"><div class="meter-labels"><span>新增资金缺口</span><span class="rust" style="font-size:24px">${s.phase===2?'2.8万亿元':'还差 2.3万亿元'}</span></div><div class="meter-track"><div class="meter-fill grow-horizontal"></div></div></div>`,3,'position:absolute;inset:0');
  if(s.phase===1)out+=text('严查税 + 强化社保征缴',40,305,3,'hint-pill');
  if(s.phase===3)out+=at('<div class="dark-pill" style="width:202px"><div style="font-size:13px">2030年 · 高盛测算</div><div class="gold-text" style="font-size:22px;white-space:nowrap">缺口或至4.1万亿</div></div>',703,148,4);break;
 case 'gross':out+=bars()+figure('bank','',193,98,63,false,1)+figure('bank','',526,81,63,false,1)+coinGroup(263,51,2,3)+coinGroup(595,24,2,3);break;
 case 'return':out+=bars();out+=F('<div class="return-equation"><b>收走的钱</b><span>−</span><b>公共社会保障支出</b><span>＝</span><b>实收税负</b></div>',3,'position:absolute;inset:0');break;
 case 'net':out+=bars(13.9,12.9,true);break;
 case 'income':
  out+=F(`<div class="income-panel"><div class="scene-label">人均收入</div>${figure('purse','',105,66,78,false,1)}<div class="income-meter"><i class="grow-horizontal"></i></div><div class="note rust" style="position:absolute;left:18px;right:18px;top:217px">约为OECD的四成多</div><div class="welfare-label">${icon('paper')}公共福利仍有距离</div></div>`,1,'position:absolute;inset:0');
  out+=F('<div class="income-bars"><div class="scene-label">实收口径税负</div><div class="bar-comparison"><div class="chart-column"><div class="bar-number strong">13.9%</div><div class="bar growbar" style="--height:81px"></div><div class="bar-label">中国</div></div><div class="chart-column oecd"><div class="bar-number">12.9%</div><div class="bar growbar" style="--height:76px"></div><div class="bar-label">OECD平均</div></div></div></div>',2,'position:absolute;inset:0');break;
 case 'infra':case 'returns':
  out+=figure('road','公路',68,91,72,true,1)+figure('ship','港口',268,62,77,true,1)+figure('plug','电网',461,101,69,true,2)+figure('city','城市',648,67,83,true,2);
  out+=flow(['M29 313 C248 224 349 230 451 273 S713 307 839 251'],2)+floatIcon('coin',6,298,31,2);
  if(s.scene==='infra')out+=coinGroup(790,123,9,3);

 case 'rebalance':

 case 'oldsource':

function canvasHTML(s,i){return `${header(s,i)}<div class="scene-body" data-scene="${s.scene}">${scene(s)}</div><div class="slide-tail"><span>${esc(s.phaseName)}</span><span class="phase-line" style="--progress:${(i+1)/DECK.slides.length*100}%"><i></i></span><span>${s.timeLabel}</span></div>`;}

const $ = id => document.getElementById(id);
const stage=$('canvas'),host=$('stage-host'),audio=$('narration');
const narrationAvailable=audio.dataset.localOnly!=='true';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const state={index:0,stepMode:false,step:1,maxStep:1,auto:false,virtualTime:0,clock:0,activeRow:-1,counterFrame:0,toastTimer:0};
const mmss=t=>{const n=Math.floor(Math.max(0,t));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;};
function notify(message){$('toast').textContent=message;$('toast').classList.add('visible');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),3200);}
function slideAt(t){for(let i=DECK.slides.length-1;i>=0;i--)if(t>=DECK.slides[i].start-.005)return i;return 0;}
function resize(){const width=host.clientWidth;stage.style.transform=`scale(${width/1000})`;document.querySelectorAll('.mini').forEach(m=>{m.querySelector('.canvas').style.transform=`scale(${m.clientWidth/1000})`;});}
new ResizeObserver(resize).observe(host);
function animateNumbers(){cancelAnimationFrame(state.counterFrame);const nodes=[...stage.querySelectorAll('[data-count]')].filter(n=>n.closest('.fragment').classList.contains('revealed'));if(reduced){nodes.forEach(n=>n.textContent=Number(n.dataset.count).toFixed(Number(n.dataset.digits)));return;}const begin=performance.now();function frame(now){let done=true;for(const n of nodes){const delay=(Number(n.closest('.fragment').dataset.order)-1)*320;const p=Math.min(1,Math.max(0,(now-begin-delay)/1050));n.textContent=(Number(n.dataset.count)*(1-Math.pow(1-p,3))).toFixed(Number(n.dataset.digits));if(p<1)done=false;}if(!done)state.counterFrame=requestAnimationFrame(frame);}state.counterFrame=requestAnimationFrame(frame);}
function fragments(){stage.querySelectorAll('.fragment').forEach(el=>{const order=Number(el.dataset.order)||1;el.style.setProperty('--delay',state.stepMode?'0ms':`${(order-1)*320}ms`);el.classList.toggle('revealed',!state.stepMode||order<=state.step);});$('step-next').hidden=!state.stepMode;$('step-next').textContent=state.step>=state.maxStep?'本页已展开':`展开一步 ${state.step}/${state.maxStep}`;$('step-next').disabled=state.step>=state.maxStep;$('step-mode').setAttribute('aria-pressed',String(state.stepMode));animateNumbers();}
function renderTranscript(s){$('subtitle-title').textContent=s.title;$('subtitle-range').textContent=`${mmss(s.start)}—${mmss(s.end)}`;$('subtitle-page').textContent=`第 ${state.index+1} 页 · ${s.phaseName}`;$('subtitle-body').innerHTML=s.cues.map((c,i)=>`<tr data-segment="${i}" tabindex="0" aria-label="从${mmss(c.start)}播放原声"><td>${mmss(c.start)}</td><td>${esc(c.text)}</td></tr>`).join('');$('subtitle-scroll').scrollTop=0;state.activeRow=-1;}
function renderSlide(index,{seek=true,transition=true}={}){index=Math.max(0,Math.min(DECK.slides.length-1,index));const s=DECK.slides[index];if(transition&&!reduced&&stage.innerHTML){host.querySelectorAll('.outgoing').forEach(n=>n.remove());const old=stage.cloneNode(true);old.removeAttribute('id');old.classList.add('outgoing','freeze');old.setAttribute('aria-hidden','true');old.style.pointerEvents='none';host.append(old);old.animate([{opacity:1},{opacity:0}],{duration:200,easing:'ease-out'}).finished.then(()=>old.remove()).catch(()=>old.remove());}
state.index=index;state.step=1;state.virtualTime=s.start;stage.innerHTML=canvasHTML(s,index);stage.setAttribute('aria-label',`第${index+1}张幻灯片：${s.title}，${s.phaseName}`);state.maxStep=Math.max(...[...stage.querySelectorAll('[data-order]')].map(n=>Number(n.dataset.order)),1);
$('page-select').value=String(index);$('page-count').innerHTML=`${String(index+1).padStart(2,'0')} <span>/ ${DECK.slides.length}</span>`;$('previous').disabled=index===0;$('next').disabled=index===DECK.slides.length-1;$('slide-range').value=index;$('slide-range').style.setProperty('--fill',`${index/(DECK.slides.length-1)*100}%`);$('phase-name').textContent=s.phaseName;$('source-range').textContent=`原视频 ${mmss(s.start)}—${mmss(s.end)}`;
renderTranscript(s);resize();requestAnimationFrame(fragments);if(seek){try{audio.currentTime=s.start;}catch{}if(state.auto)state.clock=performance.now();}try{history.replaceState(null,'',`#slide=${index+1}`);}catch{}if(transition&&!reduced)stage.animate([{opacity:.15},{opacity:1}],{duration:330,easing:'ease-out'});highlight(s.start);}
function highlight(time){const cues=DECK.slides[state.index].cues;if(!cues.length)return;let i=cues.findIndex(c=>time>=c.start&&time<c.end);if(i<0){i=0;for(let j=0;j<cues.length;j++)if(time>=cues[j].start)i=j;}if(i===state.activeRow)return;state.activeRow=i;const rows=$('subtitle-body').querySelectorAll('tr');rows.forEach((r,j)=>r.classList.toggle('active',j===i));const row=rows[i],scroller=$('subtitle-scroll');if(row){const top=row.offsetTop;const header=30;if(top<scroller.scrollTop+header||top+row.offsetHeight>scroller.scrollTop+scroller.clientHeight)scroller.scrollTo({top:Math.max(0,top-header-12),behavior:reduced?'auto':'smooth'});}}
function updateAudioUI(){const playing=!audio.paused;$('audio-toggle').disabled=!narrationAvailable;$('audio-toggle').setAttribute('aria-label',narrationAvailable?'播放或暂停原视频音频':'原声仅本地提供，可通过原视频链接收听');$('audio-toggle').setAttribute('aria-pressed',String(playing));$('audio-toggle').innerHTML=narrationAvailable?`${uiIcon(playing?'pause':'play')}<span>${playing?'暂停原声':'播放原声'}</span>`:`${uiIcon('play')}<span>原声仅本地提供</span>`;$('audio-toggle').title=narrationAvailable?'播放或暂停原声':'可通过原视频链接收听讲解';$('mode-dot').classList.toggle('playing',playing||state.auto);$('playback-label').textContent=playing?'原声跟随':state.auto?'自动演示':'自由翻页';$('auto-toggle').setAttribute('aria-pressed',String(state.auto));$('auto-toggle').textContent=state.auto?'暂停演示':'自动演示';}
async function playAt(time){if(!narrationAvailable){notify('原声仅本地提供，可通过上方原视频链接收听；仍可自由翻页或自动演示。');return;}state.auto=false;try{audio.currentTime=time;await audio.play();updateAudioUI();}catch(e){notify('原声暂时无法播放，请确认音频文件与网页在同一文件夹；仍可自由翻页。');updateAudioUI();}}
function uiIcon(name){const paths={play:'<path d="m6 3 10 7-10 7z"/>',pause:'<path d="M7 3v14m6-14v14"/>',left:'<path d="m12 4-6 6 6 6"/>',right:'<path d="m8 4 6 6-6 6"/>',grid:'<rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/><rect x="3" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/>',full:'<path d="M3 7V3h4m6 0h4v4M3 13v4h4m6 0h4v-4"/>',replay:'<path d="M4 8a7 7 0 1 1 0 6M4 3v5h5"/>',close:'<path d="m5 5 10 10M15 5 5 15"/>'};return `<svg class="ui-icon" viewBox="0 0 20 20" aria-hidden="true">${paths[name]||''}</svg>`;}
$('page-select').innerHTML=DECK.slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.title)} · ${esc(s.phaseName)}</option>`).join('');$('slide-range').max=DECK.slides.length-1;$('previous').innerHTML=uiIcon('left');$('next').innerHTML=uiIcon('right');$('gallery-open').innerHTML=uiIcon('grid')+'全部页面';$('fullscreen').innerHTML=uiIcon('full')+'<span>全屏</span>';$('replay').innerHTML=uiIcon('replay')+'重播动效';$('gallery-close').innerHTML=uiIcon('close');
$('page-select').addEventListener('change',e=>renderSlide(Number(e.target.value)));$('slide-range').addEventListener('input',e=>renderSlide(Number(e.target.value)));$('previous').onclick=()=>renderSlide(state.index-1);$('next').onclick=()=>renderSlide(state.index+1);$('replay').onclick=()=>{stage.innerHTML=canvasHTML(DECK.slides[state.index],state.index);state.step=1;requestAnimationFrame(fragments);};$('step-mode').onclick=()=>{state.stepMode=!state.stepMode;state.step=1;fragments();};$('step-next').onclick=()=>{if(state.step<state.maxStep){state.step++;fragments();}};
$('audio-toggle').onclick=async()=>{if(!audio.paused){audio.pause();updateAudioUI();return;}const s=DECK.slides[state.index];await playAt(audio.currentTime>=s.start&&audio.currentTime<s.end?audio.currentTime:s.start);};audio.addEventListener('play',updateAudioUI);audio.addEventListener('pause',updateAudioUI);audio.addEventListener('ended',updateAudioUI);audio.addEventListener('seeked',()=>{const i=slideAt(audio.currentTime);if(i!==state.index)renderSlide(i,{seek:false});highlight(audio.currentTime);});
$('auto-toggle').onclick=()=>{if(!audio.paused)audio.pause();state.auto=!state.auto;state.virtualTime=DECK.slides[state.index].start;state.clock=performance.now();updateAudioUI();};
function cueAction(row){if(!row)return;const cue=DECK.slides[state.index].cues[Number(row.dataset.segment)];if(cue)playAt(cue.start);}$('subtitle-body').addEventListener('click',e=>cueAction(e.target.closest('[data-segment]')));$('subtitle-body').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();cueAction(e.target.closest('[data-segment]'));}});
$('copy-cues').onclick=async()=>{const s=DECK.slides[state.index];const content=`${s.title}\n${s.phaseName}\n原视频 ${mmss(s.start)}—${mmss(s.end)}\n\n${s.cues.map(c=>c.text).join('')}`;try{await navigator.clipboard.writeText(content);}catch{const ta=document.createElement('textarea');ta.value=content;ta.style.position='fixed';ta.style.opacity=0;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();}notify('已复制当前页讲稿');};
function buildGallery(query=''){query=query.trim().toLowerCase();const matches=DECK.slides.map((s,i)=>({s,i})).filter(({s})=>(s.title+' '+s.phaseName+' '+s.cues.map(c=>c.text).join('')).toLowerCase().includes(query));$('gallery-grid').innerHTML=matches.length?matches.map(({s,i})=>`<button class="gallery-card ${i===state.index?'selected':''}" data-page="${i}" aria-label="跳转到第${i+1}页 ${esc(s.title)}"><div class="mini"><div class="canvas">${canvasHTML(s,i)}</div></div><div class="gallery-card-footer"><b>${String(i+1).padStart(2,'0')}</b>${esc(s.title)}<small>${esc(s.phaseName)} · ${s.timeLabel}</small></div></button>`).join(''):'<div class="empty-gallery">没有匹配的页面</div>';$('gallery-count').textContent=`${matches.length} / ${DECK.slides.length} 页`;requestAnimationFrame(resize);}
function gallery(){buildGallery();$('gallery-search').value='';$('gallery').showModal();requestAnimationFrame(()=>{resize();$('gallery-search').focus();});}$('gallery-open').onclick=gallery;$('gallery-close').onclick=()=>$('gallery').close();$('gallery-search').addEventListener('input',e=>buildGallery(e.target.value));$('gallery-grid').addEventListener('click',e=>{const target=e.target.closest('[data-page]');if(target){renderSlide(Number(target.dataset.page));$('gallery').close();}});$('gallery').addEventListener('click',e=>{if(e.target===$('gallery')){const r=$('gallery').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('gallery').close();}});
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('presentation').requestFullscreen();}catch{notify('当前浏览器不支持全屏，可以使用浏览器的全屏模式。');}};document.addEventListener('fullscreenchange',()=>requestAnimationFrame(resize));
document.addEventListener('keydown',e=>{if($('gallery').open||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||(e.key===' '&&e.target.closest('button')))return;if(e.key==='ArrowRight'){e.preventDefault();renderSlide(state.index+1);}else if(e.key==='ArrowLeft'){e.preventDefault();renderSlide(state.index-1);}else if(e.key===' '){e.preventDefault();if(state.stepMode&&state.step<state.maxStep){state.step++;fragments();}else renderSlide(state.index+1);}else if(e.key==='Home'){e.preventDefault();renderSlide(0);}else if(e.key==='End'){e.preventDefault();renderSlide(DECK.slides.length-1);}else if(e.key.toLowerCase()==='r')$('replay').click();else if(e.key.toLowerCase()==='g')gallery();});
window.addEventListener('hashchange',()=>{const i=Number(new URLSearchParams(location.hash.slice(1)).get('slide'))-1;if(Number.isInteger(i)&&i>=0&&i<DECK.slides.length&&i!==state.index)renderSlide(i);});
let lastUpdate=0;function tick(now){if(now-lastUpdate>120){let t=null;if(!audio.paused)t=audio.currentTime;else if(state.auto){state.virtualTime+=(now-state.clock)/1000;state.clock=now;t=state.virtualTime;if(t>=DECK.duration){state.auto=false;updateAudioUI();t=DECK.duration-.02;}}if(t!==null){const i=slideAt(t);if(i!==state.index){renderSlide(i,{seek:false});state.virtualTime=t;state.clock=now;}highlight(t);$('play-time').textContent=`${mmss(t)} / ${mmss(DECK.duration)}`;}lastUpdate=now;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
const initial=Number(new URLSearchParams(location.hash.slice(1)).get('slide'))-1;renderSlide(Number.isInteger(initial)&&initial>=0&&initial<DECK.slides.length?initial:0,{transition:false});updateAudioUI();
