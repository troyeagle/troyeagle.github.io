<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="use-iframe" content="true"><meta name="html-box-height-mode" content="auto"><meta name="description" content="FictionJunction 与 Kalafina 音乐性及艺术性的九维对照图。"><title>音乐性与艺术性对照</title>
<style>:root{--bg:#fff;--fg:#172033;--muted:#687386;--line:#dce1e8;--fj:#2f6fed;--kal:#a54a7b;--soft:#f5f7fa}@media(prefers-color-scheme:dark){:root{--bg:#17191f;--fg:#f3f5f8;--muted:#aeb7c5;--line:#414755;--fj:#78a3ff;--kal:#e18bb9;--soft:#23262e}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}.wrap{padding:16px;width:100%}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:20px;font-weight:600;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}.controls{display:flex;gap:8px}button{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:7px;padding:7px 10px;font-size:13px;cursor:pointer}svg{display:block;width:100%;height:auto;margin-top:10px}</style></head>
<body><div class="wrap"><div class="top"><div><h1>音乐性与艺术性九维对照</h1><div class="sub">排除成员、绑定作品与商业表现后的结构性差异</div></div><div class="controls"><button id="svgBtn">导出 SVG</button><button id="pngBtn">导出 PNG</button></div></div><svg id="chart" viewBox="0 0 800 950" role="img" aria-label="FictionJunction 与 Kalafina 九个艺术维度的对照矩阵"></svg></div>
<script>
const rows=[
['艺术主体','梶浦在项目内部；创作人格与现场延伸','梶浦从外部塑造的独立艺术对象'],['创作起点','先有旋律或歌曲，再连接声音','先设定多声部世界，声部关系反过来决定作曲'],['作品边界','开放：可吸收旧作、重编、自我翻唱','相对封闭：需通过“是否属于 Kalafina”的内部标准'],['核心复杂性','曲目之间的多样性、重连与现场转化','单曲内部的复调、声部移动与多层叙事'],['合唱功能','可调用的重要手段，可让位于主旋律或乐队','音乐本体，可同时承担旋律、节奏、和声与叙事'],['现场逻辑','从现场关系产生录音；梶浦本人在场','从高度设计的录音出发，再获得独立现场身体'],['时间组织','间歇性，随创作契机发生','持续十年，形成表现能力与作曲互相推动的闭环'],['审美方法','接纳异质性；违和感可成为趣味','建立内部一致性，再从复杂走向删减与纯化'],['叙事关系','歌曲可迁移，意义随新连接改变','建造可供听者进入并共同补全的想象空间']];
const svg=document.getElementById('chart');function e(n,a={},t=''){const x=document.createElementNS('http://www.w3.org/2000/svg',n);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));if(t)x.textContent=t;return x}function wrap(text,x,y,w,cls){const line=Math.max(10,Math.floor(w/13)),node=e('text',{x,y,'font-size':12,class:cls});for(let i=0;i<text.length;i+=line)node.append(e('tspan',{x,dy:i?18:0},text.slice(i,i+line)));return node}
function draw(){svg.innerHTML='';svg.append(e('style',{},`text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:var(--fg)}.fj{fill:var(--fj)}.kal{fill:var(--kal)}.muted{fill:var(--muted)}.line{stroke:var(--line);stroke-width:1}`));svg.append(e('text',{x:285,y:30,'text-anchor':'middle','font-size':15,'font-weight':600,class:'fj'},'FictionJunction'));svg.append(e('text',{x:620,y:30,'text-anchor':'middle','font-size':15,'font-weight':600,class:'kal'},'Kalafina'));
 rows.forEach((r,i)=>{const y=55+i*96;svg.append(e('rect',{x:18,y,width:764,height:82,rx:8,fill:i%2?'var(--bg)':'var(--soft)',stroke:'var(--line)'}));svg.append(e('text',{x:105,y:y+46,'text-anchor':'middle','font-size':13,'font-weight':600},r[0]));svg.append(e('line',{x1:190,y1:y+10,x2:190,y2:y+72,class:'line'}));svg.append(e('line',{x1:468,y1:y+10,x2:468,y2:y+72,class:'line'}));svg.append(wrap(r[1],208,y+29,230,''));svg.append(wrap(r[2],486,y+29,268,''));});svg.append(e('text',{x:285,y:930,'text-anchor':'middle','font-size':14,'font-weight':600,class:'fj'},'开放实验室与现场工作台'));svg.append(e('text',{x:620,y:930,'text-anchor':'middle','font-size':14,'font-weight':600,class:'kal'},'持续雕刻的女声复调作品体'));}
function save(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function raw(){const c=svg.cloneNode(true);c.style.background=getComputedStyle(document.documentElement).getPropertyValue('--bg');return new XMLSerializer().serializeToString(c)}svgBtn.onclick=()=>save(new Blob([raw()],{type:'image/svg+xml'}),'fj-kalafina-artistic-comparison.svg');pngBtn.onclick=()=>{const u=URL.createObjectURL(new Blob([raw()],{type:'image/svg+xml'})),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1600;c.height=1900;const g=c.getContext('2d');g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg');g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>save(b,'fj-kalafina-artistic-comparison.png'));URL.revokeObjectURL(u)};img.src=u};draw();
</script></body></html>
