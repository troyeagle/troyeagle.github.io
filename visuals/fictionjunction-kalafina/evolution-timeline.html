<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="use-iframe" content="true"><meta name="html-box-height-mode" content="auto"><meta name="description" content="2008 至 2019 年 FictionJunction 合唱型项目与 Kalafina 的双轨音乐发展时间线。"><title>双轨发展时间线</title>
<style>:root{--bg:#fff;--fg:#172033;--muted:#687386;--line:#dce1e8;--fj:#2f6fed;--kal:#a54a7b;--soft:#f5f7fa}@media(prefers-color-scheme:dark){:root{--bg:#17191f;--fg:#f3f5f8;--muted:#aeb7c5;--line:#414755;--fj:#78a3ff;--kal:#e18bb9;--soft:#23262e}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}.wrap{padding:16px;width:100%}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:20px;font-weight:600;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}.controls{display:flex;gap:8px}button{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:7px;padding:7px 10px;font-size:13px;cursor:pointer}svg{display:block;width:100%;height:auto;margin-top:10px}</style></head>
<body><div class="wrap"><div class="top"><div><h1>2008—2019 双轨发展时间线</h1><div class="sub">同一作曲体系中的两种演化方向</div></div><div class="controls"><button id="svgBtn">导出 SVG</button><button id="pngBtn">导出 PNG</button></div></div><svg id="chart" viewBox="0 0 800 950" role="img" aria-label="FictionJunction 与 Kalafina 从 2008 到 2019 年的双轨发展时间线"></svg></div>
<script>
const rows=[
['2008 前史','Yuki Kajiura LIVE 形成“键盘＋现场乐队＋多人声部”的表演体系。','特定声音项目启动；仍处于实验与流动阶段。'],
['2009 定型','《Everlasting Songs》《Parallel Hearts》把现场合唱结构统一纳入 FictionJunction。','《Seventh Heaven》完成第一阶段语言，从项目走向独立音乐边界。'],
['2009—2011','相对简化的乐队承载复杂合唱；录音与现场相互反推。','从透明、电影性的早期写法，扩展到更强节奏组、弦乐与独立歌曲结构。'],
['2011—2013','不要求作品共享封闭世界；可重新分配主旋律、合唱与配器。','《After Eden》《Consolation》推高三声密度；《dolce》接近可无伴奏成立。'],
['2013—2014','《elemental》并置旧作、重构与现场型作品，重“连接”而非统一风格。','多线旋律、三声交错、摇滚节奏组与弦乐共同叙事的语法稳定。'],
['2015—2017','录音室专辑暂停，重心回到 Yuki Kajiura LIVE，呈现“随契机活动”。','复杂之后主动简化：同时录音、呼吸、倍音与三声自身节奏。'],
['2018','继续作为梶浦本人的创作与现场框架存在。','梶浦退出制作，组合随后实质停止活动。'],
['2019','项目主体仍为梶浦本人，未随 Kalafina 停止。','3 月 13 日正式宣布解散。']];
const svg=document.getElementById('chart');function e(n,a={},t=''){const x=document.createElementNS('http://www.w3.org/2000/svg',n);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));if(t)x.textContent=t;return x}
function wrap(text,x,y,w,cls){const words=[...text],line=Math.max(12,Math.floor(w/13)),node=e('text',{x,y,'font-size':12,class:cls});for(let i=0;i<words.length;i+=line){const t=e('tspan',{x,dy:i?18:0},words.slice(i,i+line).join(''));node.append(t)}return node}
function draw(){svg.innerHTML='';svg.append(e('style',{},`text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:var(--fg)}.muted{fill:var(--muted)}.fj{fill:var(--fj)}.kal{fill:var(--kal)}.line{stroke:var(--line);stroke-width:1}`));svg.append(e('text',{x:270,y:30,'text-anchor':'middle','font-size':15,'font-weight':600,class:'fj'},'FictionJunction'));svg.append(e('text',{x:600,y:30,'text-anchor':'middle','font-size':15,'font-weight':600,class:'kal'},'Kalafina'));svg.append(e('line',{x1:118,y1:55,x2:118,y2:920,class:'line'}));
 rows.forEach((r,i)=>{const y=65+i*108;svg.append(e('circle',{cx:118,cy:y+14,r:5,fill:'var(--fg)'}));svg.append(e('text',{x:100,y:y+18,'text-anchor':'end','font-size':12,'font-weight':600},r[0]));svg.append(e('rect',{x:145,y,width:285,height:88,rx:8,fill:'var(--soft)',stroke:'var(--line)'}));svg.append(e('rect',{x:455,y,width:300,height:88,rx:8,fill:'var(--soft)',stroke:'var(--line)'}));svg.append(e('rect',{x:145,y,width:5,height:88,rx:2,class:'fj'}));svg.append(e('rect',{x:455,y,width:5,height:88,rx:2,class:'kal'}));svg.append(wrap(r[1],165,y+23,245,''));svg.append(wrap(r[2],475,y+23,260,''));});}
function save(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function raw(){const c=svg.cloneNode(true);c.style.background=getComputedStyle(document.documentElement).getPropertyValue('--bg');return new XMLSerializer().serializeToString(c)}svgBtn.onclick=()=>save(new Blob([raw()],{type:'image/svg+xml'}),'fj-kalafina-timeline.svg');pngBtn.onclick=()=>{const u=URL.createObjectURL(new Blob([raw()],{type:'image/svg+xml'})),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1600;c.height=1900;const g=c.getContext('2d');g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg');g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>save(b,'fj-kalafina-timeline.png'));URL.revokeObjectURL(u)};img.src=u};draw();
</script></body></html>
