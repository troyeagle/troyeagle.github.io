name: Reusable static application publisher

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      publisher_ref:
        type: string
        required: true
    secrets:
      BLOG_DISPATCH_TOKEN:
        required: false

permissions: {}

jobs:
  build:
    name: Build static application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: profile
        name: Load the pinned publisher and validate the caller
        env:
          PUBLISHER_REF: ${{ inputs.publisher_ref }}
          STATIC_APP: ${{ inputs.app }}
        run: |
          if [[ ! "$PUBLISHER_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Invalid publisher revision' >&2
            exit 1
          fi
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/troyeagle/troyeagle.github.io/$PUBLISHER_REF/.github/scripts/package-static.mjs" \
            -o "$RUNNER_TEMP/package-static.mjs"
          node "$RUNNER_TEMP/package-static.mjs" profile "$STATIC_APP"
      - name: Set up pnpm
        if: steps.profile.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '9.15.9'
          run_install: false
      - name: Set up Yarn Classic
        if: steps.profile.outputs.manager == 'yarn'
        run: |
          if [[ "$(yarn --version 2>/dev/null || true)" != '1.22.22' ]]; then
            npm install --global yarn@1.22.22 --no-audit --no-fund
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: ${{ steps.profile.outputs.manager }}
          cache-dependency-path: ${{ steps.profile.outputs.lockfile }}
      - name: Install locked dependencies
        run: ${{ steps.profile.outputs.install }}
      - name: Run application checks
        run: ${{ steps.profile.outputs.test }}
        env:
          CI: 'true'
      - name: Build static application
        run: ${{ steps.profile.outputs.build }}
        env:
          CI: 'true'
          PUBLIC_URL: ${{ steps.profile.outputs.public_url }}
          GENERATE_SOURCEMAP: ${{ steps.profile.outputs.source_maps }}
      - name: Package the trusted release
        id: release
        if: github.event_name != 'pull_request' && github.ref == steps.profile.outputs.release_ref
        env:
          STATIC_APP: ${{ inputs.app }}
        run: |
          node "$RUNNER_TEMP/package-static.mjs" package "$STATIC_APP"
          echo 'released=true' >> "$GITHUB_OUTPUT"
      - name: Upload static output
        if: github.event_name != 'pull_request' && github.ref == steps.profile.outputs.release_ref
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-${{ inputs.app }}
          path: ${{ steps.profile.outputs.output }}/
          if-no-files-found: error
          retention-days: 14

  notify:
    name: Notify blog
    needs: build
    if: needs.build.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Request blog synchronization
        env:
          BLOG_DISPATCH_TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.BLOG_DISPATCH_TOKEN;
          if (!token) {
            console.log('::notice::Static artifact ready; notification token is optional. Scheduled/manual collection remains available.');
            process.exit(0);
          }
          for (let attempt = 1; attempt <= 3; attempt++) {
            const response = await fetch('https://api.github.com/repos/troyeagle/troyeagle.github.io/actions/workflows/sync-apps.yml/dispatches', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ ref: 'master', inputs: { dry_run: 'false' } }),
            });
            if (response.ok) { console.log('Blog synchronization requested.'); process.exit(0); }
            if (attempt === 3) throw new Error(`Dispatch failed (HTTP ${response.status}); artifact remains available.`);
            await new Promise(resolve => setTimeout(resolve, attempt * 2000));
          }
          JS
